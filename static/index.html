<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>体检循证与健康管理工作台</title>
    <link rel="stylesheet" href="/static/style.css?v=20261119-guides-home" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">✚</span>
        <div>
          <strong>体检循证与健康管理工作台</strong>
          <small>体检解读 · 临床指南 · 随访工具</small>
          <small class="update-status" id="update-status">内容持续更新中</small>
        </div>
      </div>
      <div class="topright">
        <span id="clock"></span
        ><button
          id="theme"
          class="ghost"
          aria-label="切换主题"
          title="切换主题"
        >
          ◐
        </button>
      </div>
    </header>
    <div class="shell">
      <aside>
        <nav id="nav">
          <button data-page="home" class="active">首页</button
          ><button data-page="today">今日研修</button
          ><button data-page="archive">▦　每日课程档案</button
          ><button data-page="evidence">循证指南与应用</button
          ><button data-page="readings">体检病例精读库</button
          ><button data-page="papers">▤　循证文献库</button
          ><button data-page="chronic">体检专题</button
          ><button data-page="topics">◈　专题知识库</button
          ><button data-page="cases">☑　临床案例训练</button
          ><button data-page="tools">▣　健康管理工具库</button
          ><button data-page="profile">◎　我的学习中心</button>
        </nav>
        <div class="sidefoot">
          数据保存在当前服务器<br /><span id="syncStatus"
            >正在检查同步状态</span
          >
        </div>
      </aside>
      <main id="main"><div class="loading">正在加载研修中心…</div></main>
    </div>
    <dialog id="credentials">
      <form method="dialog">
        <label for="access-token">学习中心与写入访问口令</label
        ><input
          id="access-token"
          type="password"
          autocomplete="current-password"
        />
        <div class="actions">
          <button class="btn secondary" value="cancel">取消</button
          ><button class="btn" value="confirm">确认</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="/static/case-library.js?v=5"></script>
    <script src="/static/evidence-resources.js?v=20261119-guides-home"></script>
    <script src="/static/app.js?v=20261119-guides-home"></script>
  </body>
</html>
